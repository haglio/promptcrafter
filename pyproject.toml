[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcrafter"
version = "0.1.0"
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning, which is how this family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# this repo's venv holds today.
# The family repos this one runs are named at the tags it was built against
# rather than left to be whatever checkouts sit beside it. Unpinned, a change
# landing in one of them reached every consumer the same minute, and one whose
# other half had not landed turned all of them red at once. Moving to a newer
# one is this repo's own commit, with its own suite to answer for it.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.140",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.123",
    "PyQt6>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-qt>=4,<5", "pytest-timeout>=2.4,<3", "vulture>=2.16,<3",
       "ruff==0.16.6"]

[tool.pytest.ini_options]
# The content guard's enforcement check, taken from app_support rather than
# kept here as a copy: no tracked file may carry a blocklisted term. A `-p`
# that cannot be imported is a hard failure with no tests run, which is the
# answer wanted -- a checkout that has stopped being guarded must not look
# like a green one.
#
# The timeout is a ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the collection-order probe, which spawns a pytest child, at
# about half a second. --timeout-method=thread is the half that pays for
# itself: it dumps the stack of the test that stopped, which turns a stalled
# required check into a one-line diagnosis. tests/test_timeouts.py holds all
# three halves of it.
addopts = "-p app_support.sanitize.pytest_plugin --timeout=60 --timeout-method=thread"
testpaths = ["tests"]
qt_api = "pyqt6"

# The family checkouts this one is installed beside. app_support was imported at
# every launch -- `process_name` reaches for `ProcessNamer` -- and named nowhere
# in this file, so anyone installing the declared way got an app whose process
# naming quietly did nothing. Neither sibling is published, so neither can go in
# [project.dependencies]; tests/test_dependencies.py holds this list against the
# tree instead.
[tool.haglio]
siblings = ["app_support", "shared_ui"]

[tool.setuptools.packages.find]
include = ["promptcrafter*"]
namespaces = false
