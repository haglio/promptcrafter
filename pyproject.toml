[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcrafter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyQt6"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pytest-timeout", "vulture"]

[tool.pytest.ini_options]
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan at ~2.5 s, so 60 s clears it twenty times over and
# can only bite on a hang. The thread method prints the hung stack, which is what
# turns a stalled required check into a one-line diagnosis. tests/test_timeouts.py
# holds both halves of it.
addopts = "--timeout=60 --timeout-method=thread"
testpaths = ["tests"]
qt_api = "pyqt6"

[tool.setuptools.packages.find]
include = ["promptcrafter*"]
namespaces = false
