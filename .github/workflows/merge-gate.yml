name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR
# onto current main, runs the whole suite on that candidate, and fast-forwards
# main only when this is green -- so a red tree can never land. Also runs on PRs
# for early feedback and on push to main as a visible post-merge backstop.
#
# Runs on windows-latest: this is a PyQt6 app and its pytest-qt suite needs a
# headless platform (QT_QPA_PLATFORM=offscreen). shared_ui is a sibling package
# consumed via sys.path, not PyPI: it uses a flat layout (its package files sit at
# the repo root), so it does not pip-install -- promptcrafter.paths walks up the
# tree to find it. We therefore check it out next to this repo (as a sibling dir
# under the workspace) and let paths.ensure_shared_ui_on_path put it on sys.path,
# exactly as in a normal dev checkout. app_support is not imported by this app, so
# it is not needed here.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: windows-latest
    # About three times a green run, so it can only fire on a hang. A green job
    # is ~42 s of checkout and install plus two ~8 s suite legs, so ~57 s.
    # Without this, the queue's required check would sit on a hung run until
    # GitHub's six-hour default and print nothing that named it.
    timeout-minutes: 3
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
        working-directory: pc
    steps:
      - name: Check out promptcrafter
        uses: actions/checkout@v4
        with:
          path: pc
      - name: Check out shared_ui as a sibling
        uses: actions/checkout@v4
        with:
          repository: haglio/shared_ui
          path: shared_ui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, compat mode)
        run: |
          python -m pip install --upgrade pip
          pip install "app_support @ git+https://github.com/haglio/app_support.git"
          pip install -e ".[dev]" --config-settings editable_mode=compat
      - name: Run the suite
        run: python -m pytest -q
      # Again, back to front. Reversing inverts every "this runs before that" the
      # suite has, so a test that starts leaning on the one beside it -- the
      # window fixture's state, a schema another test mutated -- goes red on the
      # commit that introduces the lean rather than on some later rename.
      # TEST_COLLECTION_ORDER=shuffle with TEST_COLLECTION_SEED is the deeper
      # local check (see tests/conftest.py); the gate takes the deterministic one.
      - name: Run the suite back to front
        env:
          TEST_COLLECTION_ORDER: reverse
        run: python -m pytest -q
