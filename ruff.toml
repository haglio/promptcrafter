line-length = 100
target-version = "py312"

[lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "PT", "DTZ", "PIE", "PERF", "FLY", "ISC", "RET", "FURB", "EXE"]
ignore = ["E501", "BLE001", "S110",
    # This repo's ratchet: each rule the family config still finds here, and its places today.
    "PLR0913",  # 7
    "PLR0917",  # 7
    "PLR0911",  # 3
    "UP007",  # 3
    "C408",  # 2
    "RET504",  # 1
]
external = ["ARG", "N", "S", "E501", "BLE001", "S110", "PLR0913", "PLR0917", "PLR0911", "UP007", "C408", "RET504"]

[lint.per-file-ignores]
"**/vulture_whitelist.py" = ["B018", "F821"]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]

[format]
quote-style = "double"
