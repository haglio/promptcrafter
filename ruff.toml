line-length = 100
target-version = "py312"

[lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "PT", "DTZ", "PIE", "PERF", "FLY", "ISC", "RET", "FURB", "EXE"]
ignore = ["E501", "BLE001", "S110",
    # This repo's ratchet: what the family config found here, to be worked off rule by rule.
    "PT009", "PLR0913", "PLR0917", "PLC0415", "PLW1510", "PLR2004", "PLR0911", "UP007", "F841", "C408", "SIM105", "RET504"]
external = ["ARG", "N", "S", "E501", "BLE001", "S110", "PT009", "PLR0913", "PLR0917", "PLC0415", "PLW1510", "PLR2004", "PLR0911", "UP007", "F841", "C408", "SIM105", "RET504"]

[format]
quote-style = "double"
